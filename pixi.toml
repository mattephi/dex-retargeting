[project]
name = "dex-retargeting"
version = "0.5.0"
description = "Hand pose retargeting for dexterous robot hand."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.9,<3.12"
pip = "*"
numpy = ">=2.0.0,<2.4"
pytransform3d = ">=3.5.0"
nlopt = ">=2.8.0"
anytree = ">=2.12.0"
pyyaml = ">=6.0.0"
lxml = ">=5.2.2"
opencv = "*"
tqdm = "*"
tyro = "*"
pytorch = "*"
loguru = "*"

[pypi-dependencies]
dex-retargeting = { path = ".", editable = true }
meta-teleop = { path = "../meta-teleop-client", editable = true }
mediapipe = "==0.10.5"
sapien = "==3.0.0b0"

[feature.dev.dependencies]
pytest = "*"
ruff = "*"
isort = "*"

[feature.example.dependencies]
tyro = "*"
tqdm = "*"
opencv = "*"
loguru = "*"

[activation]
scripts = ["activation.sh"]

[environments]
default = { features = ["dev"], solve-group = "default" }
example = { features = ["dev", "example"], solve-group = "default" }
